  "1": { hex: "#0b1024", name: deep }
  "2": { hex: "#18204a", name: navy }
  "3": { hex: "#2e3a78", name: dusk }
  "w": { hex: "#ffffff", name: white }
  "g": { hex: "#9aa6c8", name: haze }
